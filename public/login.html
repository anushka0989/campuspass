<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - CampusPass</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">CP</span>CampusPass</a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
  </header>
  <main class="page narrow">
    <div class="page-head"><h1>Log in</h1></div>
    <form class="box" id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-block" type="submit">Log in</button>
      <p class="form-error" id="error" role="alert"></p>
      <p class="auth-alt">New here? <a href="register.html">Create an account</a></p>
    </form>
  </main>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
